# Radar de Titulares - sitio para un subdominio (reemplazar radar.example.com y el puerto si
# RADAR_PORT no es 8000). Proxy hacia uvicorn en localhost. No modifica nginx.conf.
# Requiere el certificado emitido (ver DEPLOYMENT.md). Validar con: nginx -t

server {
    listen 80;
    listen [::]:80;
    server_name radar.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Para nginx < 1.25.1 usar: listen 443 ssl http2;  (y quitar la línea "http2 on;")
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name radar.example.com;

    ssl_certificate     /etc/letsencrypt/live/radar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:radar_ssl:5m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/radar.access.log;
    error_log  /var/log/nginx/radar.error.log warn;

    # CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy y HSTS los envía la app
    # (RADAR_ENV=production). Acá no se duplican.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # El healthcheck no expone datos; se puede limitar a monitoreo interno si se prefiere.
    location = /salud {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }
}
