# Paso 1 (solo para emitir el certificado). Reemplazar radar.example.com por el subdominio.
# Instalar en /etc/nginx/sites-available/radar.conf (o conf.d/radar.conf) sin tocar nginx.conf.
server {
    listen 80;
    listen [::]:80;
    server_name radar.example.com;

    # Desafío HTTP-01 de Let's Encrypt (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
