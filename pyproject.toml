[project]
name = "radar-titulares"
version = "0.1.0"
description = "Radar de Titulares: monitoreo de Perfil, El Destape Web e Infobae"
requires-python = ">=3.11"
# Vercel instala desde acá (ignora requirements.txt cuando existe [project]): mantener ambas listas iguales.
dependencies = [
    "fastapi==0.142.2",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "sqlalchemy==2.1.3",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "defusedxml==0.7.1",
    "python-dotenv==1.2.4",
    "tzdata==2026.5",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "anthropic==1.11.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "argon2-cffi-bindings==26.1.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "docstring_parser==0.18.0",
    "click==8.5.0",
    "colorama==0.4.6; sys_platform == 'win32'",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.13.1",
    "httpx2==2.13.1",
    "idna==3.20",
    "jiter==0.17.0",
    "Mako==1.4.3",
    "MarkupSafe==3.0.4",
    "opentelemetry-api==1.45.0",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "sniffio==1.3.1",
    "truststore==0.10.4",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
