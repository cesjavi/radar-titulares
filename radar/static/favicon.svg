<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Radar rings -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
  
  <!-- Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Radar sweep -->
  <path d="M32 32 L56 32 A24 24 0 0 0 32 8 Z" fill="url(#sweepGrad)"/>
  <line x1="32" y1="32" x2="56" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Target blip / detection point -->
  <circle cx="43" cy="21" r="3" fill="#38bdf8"/>
  <circle cx="43" cy="21" r="5.5" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
  
  <!-- Center hub -->
  <circle cx="32" cy="32" r="3.5" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
</svg>
